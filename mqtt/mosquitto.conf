# XUL-J broker
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Viewers connect anonymously; publishers authenticate.
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
message_size_limit 1048576

listener 1883
protocol mqtt

listener 9001
protocol websockets
